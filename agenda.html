<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda · Microsoft AI Day @ JPMC</title>
<meta name="description" content="This week’s agenda for Microsoft AI Day at the JPMorgan Chase Plano office.">
<style>
@font-face { font-family: 'Selawik'; src: url(assets/Selawik-Regular.ttf); font-weight: 400; }
@font-face { font-family: 'Selawik'; src: url(assets/Selawik-Bold.ttf); font-weight: 600 800; }
:root { --ink:#31373D; --bronze:#936845; --bronze-dk:#7A5536; --sand:#D2B79C; --soft:#5A5F66; --line:#E2D8CC; --paper:#FBF9F6; --hl:#F1E3D2; --hl-ink:#7A5536; --br:#E9ECEA; --br-ink:#4A5560; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: 'Segoe UI', 'Selawik', Arial, sans-serif; color: var(--ink); background: #F3EFE9; line-height: 1.45; position: relative; overflow-x: hidden; }
a { color: inherit; }
.bgmap { position: fixed; right: -120px; bottom: -160px; width: 760px; opacity: .95; pointer-events: none; z-index: 0; }
.wrap { position: relative; z-index: 1; max-width: 1040px; margin: 0 auto; padding: 28px 20px 64px; }

/* top bar */
.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.logos { display: flex; align-items: flex-start; gap: 16px; }
.logos .ms { height: 30px; display: block; }
.logos .sep { width: 1.5px; height: 30px; background: #B9AE9F; align-self: center; }
.logos .jpm { height: 29px; margin-top: 4.8px; display: block; }
.back { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; font-weight: 700; font-size: 15px; color: var(--bronze); border: 1.5px solid var(--bronze); border-radius: 999px; padding: 8px 16px; background: rgba(255,255,255,.6); }
.back:hover { background: #fff; }

/* card */
.card { margin-top: 26px; background: var(--paper); border-radius: 28px; padding: 40px 44px 36px; box-shadow: 0 18px 40px rgba(49,55,61,.08); }
.eyebrow { margin: 0; font-size: 13px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--bronze); }
h1 { margin: 6px 0 0; font-size: 40px; line-height: 1.1; letter-spacing: -.5px; }
.meta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.metapill { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid #DCCDBB; border-radius: 999px; padding: 7px 14px; font-size: 15px; font-weight: 600; }
.metapill svg { flex: none; }
.updated { margin-top: 10px; font-size: 13px; color: var(--soft); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.tbtn { font: inherit; font-size: 14px; font-weight: 700; border-radius: 999px; padding: 8px 14px; border: 1.5px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
.tbtn:hover { border-color: var(--bronze); }
.tbtn.primary { background: var(--bronze); color: #fff; border-color: var(--bronze); }

/* sections + rows (modelled on the "How the day runs" layout) */
.section { margin-top: 30px; }
.shead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; cursor: pointer; user-select: none; border: 0; background: none; padding: 0; font: inherit; color: inherit; text-align: left; width: 100%; }
.shead h2 { margin: 0; font-size: 24px; letter-spacing: -.2px; }
.shead .note { font-size: 14px; color: var(--soft); }
.shead .chev { margin-left: auto; transition: transform .2s; color: var(--bronze); }
.section.collapsed .chev { transform: rotate(-90deg); }
.section.collapsed .rows { display: none; }
.rows { margin-top: 12px; display: flex; flex-direction: column; gap: 6px; }
.row { position: relative; display: grid; grid-template-columns: 190px minmax(0,1fr); gap: 16px; padding: 14px 20px; border-radius: 16px; }
.row.highlight { background: var(--hl); }
.row.break { background: var(--br); }
.row .time { font-size: 17px; font-weight: 600; color: var(--soft); padding-top: 1px; }
.row.highlight .time { color: var(--hl-ink); }
.row.break .time { color: var(--br-ink); }
.row .label { font-size: 13px; font-weight: 700; letter-spacing: 1.8px; text-transform: uppercase; color: var(--hl-ink); margin-bottom: 2px; }
.row .title { font-size: 19px; font-weight: 600; }
.row.break .title { font-weight: 500; color: var(--br-ink); }
.row .subtitle { font-size: 15.5px; color: var(--soft); margin-top: 2px; }
.roomline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 8px; font-size: 15px; color: var(--soft); }
.roomline .ri { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; }
.roomline .ri b { color: var(--ink); }
.roomline svg, .roomline img { width: 20px; height: 20px; flex: none; }
.roomline .dot { width: 4px; height: 4px; border-radius: 50%; background: #B9AE9F; }
a.ri.teams:hover b { text-decoration: underline; }
.row .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chipbtn { font: inherit; font-size: 13px; font-weight: 700; letter-spacing: .5px; border-radius: 999px; padding: 6px 12px; border: 1.5px solid var(--bronze); color: var(--bronze); background: rgba(255,255,255,.7); text-decoration: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chipbtn.solid { background: var(--bronze); color: #fff; }
.chipbtn:hover { background: #fff; }
.chipbtn.solid:hover { background: var(--bronze-dk); }
.details { margin-top: 10px; font-size: 15.5px; color: var(--ink); background: rgba(255,255,255,.75); border-radius: 12px; padding: 12px 14px; white-space: pre-line; }
.badge { position: absolute; right: 14px; top: 12px; font-size: 11px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; padding: 4px 9px; border-radius: 999px; background: var(--ink); color: #fff; }
.badge.next { background: var(--bronze); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.subcard { background: #fff; border-radius: 16px; padding: 16px 18px; box-shadow: 0 2px 8px rgba(49,55,61,.06); }
.subcard .label { color: #5B6B57; }
.subcard:nth-child(2n) .label { color: var(--hl-ink); }
.subcard .title { font-size: 17px; }

.foot { margin-top: 26px; font-size: 13px; color: var(--soft); text-align: center; }

/* ---------- editor ---------- */
.editbar { position: sticky; top: 0; z-index: 20; display: none; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 0 0 16px 16px; gap: 8px; flex-wrap: wrap; align-items: center; box-shadow: 0 8px 20px rgba(0,0,0,.2); }
body.editing .editbar { display: flex; }
.editbar .status { font-size: 13px; color: #C9CDD2; margin-right: auto; }
.editbar .tbtn { background: transparent; color: #fff; border-color: rgba(255,255,255,.35); }
.editbar .tbtn.primary { background: var(--bronze); border-color: var(--bronze); }
body.editing [data-edit] { outline: 1.5px dashed rgba(147,104,69,.45); outline-offset: 3px; border-radius: 6px; min-width: 40px; cursor: text; }
body.editing [data-edit]:focus { outline: 2px solid var(--bronze); background: rgba(255,255,255,.8); }
body.editing [data-edit]:empty::before { content: attr(data-ph); color: #A0A6AD; }
.rowtools, .sectools, .cardtools, .settings, .linkedit { display: none; }
body.editing .rowtools, body.editing .sectools, body.editing .cardtools, body.editing .linkedit { display: flex; }
body.editing .settings { display: grid; }
.rowtools { flex-wrap: wrap; gap: 6px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed rgba(49,55,61,.2); align-items: center; }
.rowtools select, .rowtools input, .settings input, .linkedit input { font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 8px; border: 1px solid #CFC6BA; background: #fff; }
.mini { font: inherit; font-size: 12px; font-weight: 700; padding: 5px 9px; border-radius: 8px; border: 1px solid #CFC6BA; background: #fff; cursor: pointer; }
.mini:hover { border-color: var(--bronze); color: var(--bronze); }
.mini.danger:hover { border-color: #B3261E; color: #B3261E; }
.linkedit { gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; font-size: 12px; color: var(--soft); }
.sectools { gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.cardtools { gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.settings { margin-top: 18px; grid-template-columns: 150px 1fr; gap: 8px 12px; align-items: center; background: #fff; border: 1.5px dashed #CDBBA7; border-radius: 14px; padding: 14px; font-size: 13px; font-weight: 600; }
.settings input { width: 100%; }
.addsec { display: none; margin-top: 24px; }
body.editing .addsec { display: inline-flex; }
body.editing .viewonly { display: none !important; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 30; }
.toast.show { opacity: 1; }

@media (max-width: 720px) {
  .card { padding: 26px 18px 24px; border-radius: 22px; }
  h1 { font-size: 30px; }
  .row { grid-template-columns: 1fr; gap: 4px; padding: 12px 14px; }
  .badge { position: static; justify-self: start; }
  .logos .ms { height: 22px; } .logos .jpm { height: 21px; margin-top: 3.5px; } .logos .sep { height: 22px; }
  .bgmap { width: 420px; right: -160px; bottom: -120px; opacity: .4; }
  .settings { grid-template-columns: 1fr; }
}
@media print {
  .bgmap, .toolbar, .back, .editbar, .rowtools, .sectools, .cardtools, .linkedit, .settings, .addsec { display: none !important; }
  body { background: #fff; } .card { box-shadow: none; }
  .section.collapsed .rows { display: flex; }
}
</style>
</head>
<body>
<img class="bgmap" src="assets/texas.svg" alt="" aria-hidden="true">

<div class="editbar" role="region" aria-label="Agenda editor">
  <span class="status" id="status">Editing. Changes save in this browser as a draft.</span>
  <button class="tbtn" id="btnImport" type="button">Import JSON</button>
  <button class="tbtn" id="btnReset" type="button">Discard draft</button>
  <button class="tbtn" id="btnPreview" type="button">Preview</button>
  <button class="tbtn primary" id="btnExport" type="button">Download agenda.json</button>
  <input type="file" id="fileIn" accept="application/json,.json" hidden>
</div>

<div class="wrap">
  <div class="top">
    <div class="logos">
      <img class="ms" src="assets/microsoft-logo.png" alt="Microsoft">
      <span class="sep"></span>
      <img class="jpm" src="assets/jpmorgan-logo.png" alt="J.P. Morgan">
    </div>
    <a class="back" href="index.html">← Back to AI Day</a>
  </div>

  <main class="card" id="app" aria-live="polite"></main>
  <p class="foot">Microsoft AI Day @ JPMC · Hosted by Danny Dias, Microsoft · <a href="https://www.linkedin.com/in/danny-dias-7a128512/" target="_blank" rel="noopener">LinkedIn</a></p>
</div>
<div class="toast" id="toast"></div>

<script>
/* Published agenda. The page loads agenda.json from the site first; this copy is the fallback. */
var DEFAULT_AGENDA = {"eyebrow": "Agenda · Microsoft AI Day @ JPMC", "title": "How the day runs", "dateLabel": "[NEXT VISIT DATE]", "date": "", "location": "JPMorgan Chase · 8181 Communications Pkwy, Plano, TX 75024", "updated": "", "sections": [{"title": "The full day", "note": "Times are Central Time.", "rows": [{"type": "highlight", "start": "09:00", "end": "12:00", "label": "White Glove Sessions · By invitation", "title": "Executive 1:1 briefings", "subtitle": "Three private 60-minute sessions, scheduled through your AI Champion’s office", "details": "", "link": {"text": "", "url": ""}, "room": "", "teams": ""}, {"type": "break", "start": "12:00", "end": "13:00", "label": "", "title": "Lunch break", "subtitle": "", "details": "", "link": {"text": "", "url": ""}, "room": "", "teams": ""}, {"type": "highlight", "start": "13:00", "end": "14:30", "label": "Copilot Pulse", "title": "What’s new in Copilot and Cowork, live", "subtitle": "See the full breakdown below", "details": "", "link": {"text": "Reserve a seat", "url": "https://aka.ms/Copilot-Clinics-JPMC"}, "room": "[PULSE ROOM]", "teams": "[PULSE TEAMS LINK]"}, {"type": "break", "start": "14:30", "end": "15:00", "label": "", "title": "Break", "subtitle": "", "details": "", "link": {"text": "", "url": ""}, "room": "", "teams": ""}, {"type": "split", "start": "15:00", "end": "17:00", "label": "", "title": "", "subtitle": "", "details": "", "link": {"text": "", "url": ""}, "cards": [{"label": "Copilot Clinic · Booked", "title": "15-minute consults on your real work", "link": {"text": "Book a slot", "url": "https://aka.ms/Copilot-Clinics-JPMC"}}, {"label": "Copilot Clinic · Walk-ins", "title": "Walk-ins welcome if there’s an opening", "link": {"text": "", "url": ""}}], "room": "[CLINIC ROOM]", "teams": "[CLINIC TEAMS LINK]"}]}, {"title": "Copilot Pulse · This week", "note": "The Pulse topics change every visit.", "rows": [{"type": "normal", "start": "13:00", "end": "13:10", "label": "", "title": "Welcome and what changed since the last visit", "subtitle": "Danny Dias, Microsoft", "details": "", "link": {"text": "", "url": ""}, "room": "", "teams": ""}, {"type": "normal", "start": "13:10", "end": "13:40", "label": "", "title": "Live demo: [FEATURE 1]", "subtitle": "[One line on why it matters]", "details": "[What you’ll see, step by step]", "link": {"text": "", "url": ""}, "room": "", "teams": ""}, {"type": "normal", "start": "13:40", "end": "14:10", "label": "", "title": "Live demo: [FEATURE 2]", "subtitle": "[One line on why it matters]", "details": "[What you’ll see, step by step]", "link": {"text": "", "url": ""}, "room": "", "teams": ""}, {"type": "highlight", "start": "14:10", "end": "14:25", "label": "Cost Corner", "title": "What AI really costs", "subtitle": "Credits, usage and the spending controls that keep costs predictable", "details": "", "link": {"text": "", "url": ""}, "room": "", "teams": ""}, {"type": "normal", "start": "14:25", "end": "14:30", "label": "", "title": "Q&A and next steps", "subtitle": "", "details": "", "link": {"text": "", "url": ""}, "room": "", "teams": ""}]}]};

(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var EDIT = params.has('edit');
  var DRAFT_KEY = 'aiday-jpmc-agenda-draft-v1';
  var data = null;
  var app = document.getElementById('app');

  // ---------- helpers ----------
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function safeUrl(u) { u = (u || '').trim(); if (!u) return ''; if (/^(https?:|mailto:)/i.test(u) || /^[\w.\-\/#?=&%]+$/.test(u) && !/^javascript:/i.test(u)) return u; return ''; }
  function fmt(t) { if (!t) return ''; var p = t.split(':'); var h = +p[0], m = p[1] || '00'; var h12 = h % 12 || 12; return h12 + ':' + m; }
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('show'); }, 1800); }
  function saveDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); document.getElementById('status').textContent = 'Draft saved in this browser · ' + new Date().toLocaleTimeString(); } catch (e) {} }
  function loadDraft() { try { var s = localStorage.getItem(DRAFT_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
  function blankRow(type) { return { type: type || 'normal', start: '', end: '', room: '', teams: '', label: '', title: '', subtitle: '', details: '', link: { text: '', url: '' }, cards: type === 'split' ? [{ label: '', title: '', link: { text: '', url: '' } }, { label: '', title: '', link: { text: '', url: '' } }] : undefined }; }

  // editable text bound to an object key
  function editable(tag, cls, obj, key, ph) {
    var e = el(tag, cls, obj[key] || '');
    if (EDIT) {
      e.setAttribute('data-edit', ''); e.setAttribute('data-ph', ph || 'Type here'); e.contentEditable = 'true'; e.spellcheck = true;
      e.addEventListener('input', function () { obj[key] = e.innerText.replace(/\n+$/, ''); saveDraft(); });
      e.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && key !== 'details') { ev.preventDefault(); e.blur(); } });
    }
    return e;
  }
  function linkEditor(obj) {
    obj.link = obj.link || { text: '', url: '' };
    var w = el('div', 'linkedit');
    w.appendChild(el('span', '', 'Button:'));
    var t = el('input'); t.placeholder = 'Button text (empty = no button)'; t.value = obj.link.text || '';
    var u = el('input'); u.placeholder = 'https://…'; u.value = obj.link.url || ''; u.style.minWidth = '220px';
    t.oninput = function () { obj.link.text = t.value; saveDraft(); };
    u.oninput = function () { obj.link.url = u.value; saveDraft(); };
    u.onchange = t.onchange = render;
    w.appendChild(t); w.appendChild(u);
    return w;
  }
  function linkButton(link, solid) {
    if (!link || !link.text || !safeUrl(link.url)) return null;
    var a = el('a', 'chipbtn' + (solid ? ' solid' : ''), link.text);
    a.href = safeUrl(link.url); if (/^https?:/i.test(a.getAttribute('href'))) { a.target = '_blank'; a.rel = 'noopener'; }
    return a;
  }

  // ---------- calendar (.ics) ----------
  var VTZ = ['BEGIN:VTIMEZONE','TZID:America/Chicago','BEGIN:DAYLIGHT','TZOFFSETFROM:-0600','TZOFFSETTO:-0500','TZNAME:CDT','DTSTART:19700308T020000','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU','END:DAYLIGHT','BEGIN:STANDARD','TZOFFSETFROM:-0500','TZOFFSETTO:-0600','TZNAME:CST','DTSTART:19701101T020000','RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU','END:STANDARD','END:VTIMEZONE'];
  function icsEsc(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;'); }
  function downloadIcs(row) {
    var d = (data.date || '').replace(/-/g, '');
    if (!/^\d{8}$/.test(d) || !row.start || !row.end) { toast('The agenda date is not set yet'); return; }
    var st = row.start.replace(':', '') + '00', en = row.end.replace(':', '') + '00';
    var title = (row.label ? row.label + ': ' : '') + (row.title || 'Microsoft AI Day @ JPMC');
    var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Microsoft AI Day JPMC//Agenda//EN','CALSCALE:GREGORIAN'].concat(VTZ).concat([
      'BEGIN:VEVENT', 'UID:' + d + st + '-' + Math.random().toString(36).slice(2) + '@aiday-jpmc',
      'DTSTAMP:' + new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, ''),
      'DTSTART;TZID=America/Chicago:' + d + 'T' + st, 'DTEND;TZID=America/Chicago:' + d + 'T' + en,
      'SUMMARY:' + icsEsc(title), 'LOCATION:' + icsEsc(data.location), 'DESCRIPTION:' + icsEsc([row.subtitle, row.details, location.href.split('?')[0]].filter(Boolean).join('\n')),
      'END:VEVENT', 'END:VCALENDAR']);
    var blob = new Blob([lines.join('\r\n')], { type: 'text/calendar' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = (row.title || 'session').replace(/[^\w]+/g, '-').slice(0, 40) + '.ics'; a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  }

  // ---------- now / next ----------
  function nowState(row) {
    var d = data.date; if (!d || !row.start || !row.end) return '';
    var now = new Date(); var today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
    if (today !== d) return '';
    var mins = now.getHours() * 60 + now.getMinutes();
    function m(t) { var p = t.split(':'); return +p[0] * 60 + +p[1]; }
    if (mins >= m(row.start) && mins < m(row.end)) return 'now';
    if (m(row.start) > mins && m(row.start) - mins <= 30) return 'next';
    return '';
  }

  // ---------- render ----------
  function move(arr, i, d) { var j = i + d; if (j < 0 || j >= arr.length) return; var t = arr[i]; arr[i] = arr[j]; arr[j] = t; saveDraft(); render(); }

  function renderRow(sec, row, i) {
    var r = el('div', 'row ' + (row.type || 'normal'));
    var st = nowState(row); if (st) r.appendChild(el('span', 'badge' + (st === 'next' ? ' next' : ''), st === 'now' ? 'Happening now' : 'Up next'));

    if (row.type === 'split') {
      row.cards = row.cards || [];
      var cards = el('div', 'cards');
      row.cards.forEach(function (cd, ci) {
        var sc = el('div', 'subcard');
        if (cd.label || EDIT) sc.appendChild(editable('div', 'label', cd, 'label', 'LABEL'));

      c.appendChild(cards);
    } else {
      if (row.label || EDIT) c.appendChild(editable('div', 'label', row, 'label', 'LABEL (optional)'));

      if (row.subtitle || EDIT) c.appendChild(editable('div', 'subtitle', row, 'subtitle', 'Speaker or one-line description (optional)'));

    // room + Teams line

      var rl = el('div', 'roomline');
      var ri = el('span', 'ri');
      ri.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#936845" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M6 21V4.5A1.5 1.5 0 0 1 7.5 3h9A1.5 1.5 0 0 1 18 4.5V21"/><path d="M14.5 12.5v.01"/></svg>';
      ri.appendChild(document.createTextNode('Room '));
      ri.appendChild(editable('b', '', row, 'room', 'room name'));
      rl.appendChild(ri);
      if (row.teams || EDIT) {
        rl.appendChild(el('span', 'dot'));
        var tu = safeUrl(row.teams);
        var tm = el(tu && /^https?:/i.test(tu) && !EDIT ? 'a' : 'span', 'ri teams');
        if (tm.tagName === 'A') { tm.href = tu; tm.target = '_blank'; tm.rel = 'noopener'; }
        tm.innerHTML = '<img src="assets/teams.svg" alt="">Join on <b>Teams</b>';
        rl.appendChild(tm);
      }
      if (EDIT) {
        var tin = el('input'); tin.placeholder = 'Teams meeting link (optional)'; tin.value = row.teams || ''; tin.style.minWidth = '240px';
        tin.style.font = 'inherit'; tin.style.fontSize = '13px'; tin.style.padding = '5px 8px'; tin.style.borderRadius = '8px'; tin.style.border = '1px solid #CFC6BA';
        tin.oninput = function () { row.teams = tin.value; saveDraft(); };
        rl.appendChild(tin);
      }
      c.appendChild(rl);
    }
    var det = null;
    if (row.details || EDIT) { det = editable('div', 'details', row, 'details', 'Details shown when people click “Details” (optional)'); if (!EDIT) det.hidden = true; }
    var actions = el('div', 'actions viewonly');
    var b2 = row.type !== 'split' ? linkButton(row.link, true) : null; if (b2) actions.appendChild(b2);
    if (det && !EDIT) {
      var tg = el('button', 'chipbtn', 'Details'); tg.type = 'button'; tg.setAttribute('aria-expanded', 'false');
      tg.onclick = function () { det.hidden = !det.hidden; tg.setAttribute('aria-expanded', String(!det.hidden)); tg.textContent = det.hidden ? 'Details' : 'Hide details'; };
      actions.appendChild(tg);
    }
    if (data.date && row.start && row.end && row.type !== 'break') {
      var cal = el('button', 'chipbtn', '+ Add to calendar'); cal.type = 'button'; cal.onclick = function () { downloadIcs(row); }; actions.appendChild(cal);
    }
    if (actions.childNodes.length) c.appendChild(actions);
    if (det) c.appendChild(det);

    if (EDIT) {
      if (row.type !== 'split') c.appendChild(linkEditor(row));
      var tools = el('div', 'rowtools');
      var sel = el('select'); sel.setAttribute('aria-label', 'Row style');
      [['normal', 'Plain row'], ['highlight', 'Highlight'], ['break', 'Break'], ['split', 'Side-by-side cards']].forEach(function (o) { var op = el('option', '', o[1]); op.value = o[0]; if (row.type === o[0]) op.selected = true; sel.appendChild(op); });
      sel.onchange = function () { row.type = sel.value; if (row.type === 'split' && !(row.cards && row.cards.length)) row.cards = blankRow('split').cards; saveDraft(); render(); };
      var s1 = el('input'); s1.type = 'time'; s1.value = row.start || ''; s1.setAttribute('aria-label', 'Start time'); s1.onchange = function () { row.start = s1.value; saveDraft(); render(); };
      var s2 = el('input'); s2.type = 'time'; s2.value = row.end || ''; s2.setAttribute('aria-label', 'End time'); s2.onchange = function () { row.end = s2.value; saveDraft(); render(); };
      tools.appendChild(sel); tools.appendChild(s1); tools.appendChild(el('span', '', '–')); tools.appendChild(s2);
      function btn(t, fn, cls) { var b = el('button', 'mini' + (cls ? ' ' + cls : ''), t); b.type = 'button'; b.onclick = fn; tools.appendChild(b); }
      btn('↑', function () { move(sec.rows, i, -1); }); btn('↓', function () { move(sec.rows, i, 1); });
      btn('Duplicate', function () { sec.rows.splice(i + 1, 0, clone(row)); saveDraft(); render(); });
      btn('Add row below', function () { sec.rows.splice(i + 1, 0, blankRow('normal')); saveDraft(); render(); });
      if (row.type === 'split') btn('Add card', function () { row.cards.push({ label: '', title: '', link: { text: '', url: '' } }); saveDraft(); render(); });
      btn('Delete', function () { if (confirmDelete('this row')) { sec.rows.splice(i, 1); saveDraft(); render(); } }, 'danger');
      c.appendChild(tools);
    }
    r.appendChild(c);
    return r;
  }
  function confirmDelete(what) { return window.confirm ? window.confirm('Delete ' + what + '?') : true; }

  function render() {
    app.textContent = '';
    app.appendChild(editable('p', 'eyebrow', data, 'eyebrow', 'EYEBROW'));
    app.appendChild(editable('h1', '', data, 'title', 'Page title'));
    var meta = el('div', 'meta');
    var p1 = el('span', 'metapill'); p1.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#936845" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';
    p1.appendChild(editable('span', '', data, 'dateLabel', 'Date shown to visitors'));
    var p2 = el('span', 'metapill'); p2.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#936845" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/></svg>';
    p2.appendChild(editable('span', '', data, 'location', 'Location'));
    meta.appendChild(p1); meta.appendChild(p2); app.appendChild(meta);
    if (data.updated && !EDIT) app.appendChild(el('div', 'updated', 'Last updated ' + data.updated));

    var tb = el('div', 'toolbar viewonly');
    var book = el('a', 'tbtn primary', 'Book a Clinic slot or Pulse seat'); book.href = 'https://aka.ms/Copilot-Clinics-JPMC'; book.target = '_blank'; book.rel = 'noopener'; tb.appendChild(book);
    var exp = el('button', 'tbtn', 'Expand all'); exp.type = 'button'; exp.onclick = function () { app.querySelectorAll('.section').forEach(function (s) { s.classList.remove('collapsed'); }); }; tb.appendChild(exp);
    var pr = el('button', 'tbtn', 'Print'); pr.type = 'button'; pr.onclick = function () { window.print(); }; tb.appendChild(pr);
    app.appendChild(tb);

    if (EDIT) {
      var set = el('div', 'settings');
      set.appendChild(el('label', '', 'Calendar date')); var di = el('input'); di.type = 'date'; di.value = data.date || ''; di.onchange = function () { data.date = di.value; saveDraft(); };
      set.appendChild(di);
      set.appendChild(el('label', '', '“Last updated” text')); var up = el('input'); up.placeholder = 'e.g. Dec 1, 2026'; up.value = data.updated || ''; up.oninput = function () { data.updated = up.value; saveDraft(); };
      set.appendChild(up);
      var hint = el('div', '', 'The calendar date turns on “Add to calendar” and the “Happening now” badges. Everything else: click any text to edit it.'); hint.style.gridColumn = '1 / -1'; hint.style.fontWeight = '400'; hint.style.color = '#5A5F66';
      set.appendChild(hint);
      app.appendChild(set);
    }

    (data.sections || []).forEach(function (sec, si) {
      sec.rows = sec.rows || [];
      var s = el('section', 'section'); s.setAttribute('aria-label', sec.title || 'Agenda section');
      var head = EDIT ? el('div', 'shead') : el('button', 'shead');
      if (!EDIT) { head.type = 'button'; head.setAttribute('aria-expanded', 'true'); head.onclick = function () { var c = s.classList.toggle('collapsed'); head.setAttribute('aria-expanded', String(!c)); }; }
      head.appendChild(editable('h2', '', sec, 'title', 'Section title'));
      if (sec.note || EDIT) head.appendChild(editable('span', 'note', sec, 'note', 'Short note (optional)'));
      if (!EDIT) { var ch = el('span', 'chev'); ch.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>'; head.appendChild(ch); }
      s.appendChild(head);
      var rows = el('div', 'rows');
      sec.rows.forEach(function (row, i) { rows.appendChild(renderRow(sec, row, i)); });
      s.appendChild(rows);
      if (EDIT) {
        var st = el('div', 'sectools');
        function sbtn(t, fn, cls) { var b = el('button', 'mini' + (cls ? ' ' + cls : ''), t); b.type = 'button'; b.onclick = fn; st.appendChild(b); }
        sbtn('+ Plain row', function () { sec.rows.push(blankRow('normal')); saveDraft(); render(); });
        sbtn('+ Highlight', function () { sec.rows.push(blankRow('highlight')); saveDraft(); render(); });
        sbtn('+ Break', function () { var r = blankRow('break'); r.title = 'Break'; sec.rows.push(r); saveDraft(); render(); });
        sbtn('+ Side-by-side cards', function () { sec.rows.push(blankRow('split')); saveDraft(); render(); });
        sbtn('Move section up', function () { move(data.sections, si, -1); });
        sbtn('Move section down', function () { move(data.sections, si, 1); });
        sbtn('Delete section', function () { if (confirmDelete('the section "' + (sec.title || 'Untitled') + '"')) { data.sections.splice(si, 1); saveDraft(); render(); } }, 'danger');
        s.appendChild(st);
      }
      app.appendChild(s);
    });
    if (EDIT) {
      var add = el('button', 'tbtn addsec', '+ Add a section'); add.type = 'button';
      add.onclick = function () { data.sections.push({ title: 'New section', note: '', rows: [blankRow('normal')] }); saveDraft(); render(); };
      app.appendChild(add);
    }
  }

  // ---------- editor bar ----------
  function setupEditor() {
    document.body.classList.add('editing');
    document.getElementById('btnExport').onclick = function () {
      var blob = new Blob([JSON.stringify(data, null, 2) + '\n'], { type: 'application/json' });
      var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'agenda.json'; a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast('Downloaded. Upload it to your GitHub repo to publish.');
    };
    document.getElementById('btnReset').onclick = function () {
      if (!confirmDelete('your draft and go back to the published agenda')) return;
      try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
      load(true);
    };
    document.getElementById('btnPreview').onclick = function () { window.open(location.pathname, '_blank'); };
    var fi = document.getElementById('fileIn');
    document.getElementById('btnImport').onclick = function () { fi.click(); };
    fi.onchange = function () {
      var f = fi.files[0]; if (!f) return; var rd = new FileReader();
      rd.onload = function () { try { var j = JSON.parse(rd.result); if (!j.sections) throw 0; data = j; saveDraft(); render(); toast('Imported'); } catch (e) { toast('That file is not an agenda.json'); } };
      rd.readAsText(f); fi.value = '';
    };
  }

  // ---------- load ----------
  function load(ignoreDraft) {
    var draft = EDIT && !ignoreDraft ? loadDraft() : null;
    if (draft) { data = draft; render(); document.getElementById('status').textContent = 'Editing your saved draft (not published yet).'; return; }
    fetch('agenda.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) { data = j; render(); })
      .catch(function () { data = clone(DEFAULT_AGENDA); render(); });
  }
  if (EDIT) setupEditor();
  load(false);
  setInterval(function () { if (!EDIT && data && data.date) render(); }, 60000); // refresh "Happening now"
})();
</script>
</body>
</html>
